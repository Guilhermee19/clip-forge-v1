[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "Alternativa local e open-source ao Opus Clip: transforma lives e podcasts em cortes verticais 9:16 com legendas animadas."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guilherme" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "websockets>=14",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "python-dotenv>=1.0",
    "faster-whisper>=1.1",
    "ctranslate2>=4.5",
    "mediapipe>=0.10.18",
    "opencv-python-headless>=4.10",
    "numpy>=1.26,<2.0",
    "yt-dlp>=2026.8.19",  # mantenha atualizado: o YouTube quebra versoes antigas
    "ffmpeg-python>=0.2",
    "httpx>=0.28",
    "rich>=13.9",
    "typer>=0.15",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12>=12.6",
    "nvidia-cudnn-cu12>=9.6",
]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
]

[project.scripts]
clipforge = "cli:main"

[tool.setuptools]
packages = ["app", "app.core", "app.api", "app.utils"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
